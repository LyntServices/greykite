[project]
name = "greykite"
version = "1.0.0"
description = "Fork of greykite 1.0.0"
authors = [
    { name = "MichaelaH", email = "michaela.honkova@lynt.cz" },
    { name = "Jan Smitka", email = "jan.smitka@lynt.cz" },
]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cvxpy>=1.4, <=1.5",
    "dill>=0.3.6,<0.4",
    "holidays==0.13",
    "holidays-ext>=0.0.8,<0.0.9",
    "ipython>=7.31.1,<8",
    "matplotlib==3.8.1",
    "numpy~=1.26.0",
    "osqp>=0.6.3,<0.7",
    "overrides>=7.3.1,<8",
    "pandas>=2.1.1,<3",
    "patsy>=0.5.2,<0.6",
    "plotly>=5.4.0,<6",
    "pmdarima~=2.0.2",
    "scipy>=1.8.0,<=1.11.4",
    "six>=1.16.0,<2",
    "scikit-learn==1.3.1",
    "statsmodels>=0.13.5,<0.14",
    "testfixtures>=6.14.2,<7",
    "tqdm>=4.64.1,<5",
    "cython>=3.0.10,<4",
]

[project.urls]
Repository = "https://github.com/LyntServices/greykite.git"

[dependency-groups]
dev = [
    "appnope==0.1.3",
    "bump2version==0.5.11",
    "click==8.0.1",
    "coverage==6.3.2",
    "flake8==6.0.0",
    "ipykernel==6.4.1",
    "ipywidgets==7.5.1",
    "jupyter==1.0.0",
    "jupyter-client==7.4.7",
    "jupyter-console==6.4.4",
    "jupyter-core==5.2.0",
    "jupyter-server==2.2.1",
    "lunarcalendar==0.0.9",
    "nbformat==5.5.0",
    "notebook==6.5.2",
    "wheel==0.33.6",
    "watchdog==0.9.0",
    "twine==1.14.0",
    "tornado==6.2",
    "sphinx-rtd-theme>=2.0.0,<3",
    "sphinx-gallery==0.10.1",
    "sphinx>=7.3.7,<8",
    "seaborn==0.11.1",
    "requests>=2.31.0,<3",
    "pyzmq==25.0.0",
    "pip==21.0.1",
    "pillow==9.4.0",
    "pytest==7.4.4",
    "pytest-runner>=5.3.1,<6",
    "cmake>=3.29.3,<4",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
