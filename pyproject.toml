[project]
name = "greykite"
version = "1.0.0"
description = "Fork of greykite 1.0.0"
authors = [
    { name = "MichaelaH", email = "michaela.honkova@lynt.cz" },
    { name = "Jan Smitka", email = "jan.smitka@lynt.cz" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cvxpy>=1.6,<2",
    "dill>=0.3.9,<0.5",
    "holidays>=0.60,<1",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2.3,<3",
    "patsy>=1.0,<2",
    "plotly>=5.24,<7",
    "pmdarima>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.5.2,<2",
    "statsmodels>=0.14.3,<0.15",
    "tqdm>=4.66.5,<5",
]

[project.urls]
Repository = "https://github.com/LyntServices/greykite.git"

[dependency-groups]
dev = [
    "bump2version>=1.0,<2",
    "click>=8.1,<9",
    "coverage>=7.6,<8",
    "flake8>=7.1,<8",
    "ipython>=8.30,<10",
    "ipykernel>=6.29,<7",
    "overrides>=7.7,<8",
    "testfixtures>=8.3,<12",
    "ipywidgets>=8.1,<9",
    "jupyter>=1.1,<2",
    "jupyter-client>=8.6,<9",
    "jupyter-console>=6.6,<7",
    "jupyter-core>=5.7,<6",
    "jupyter-server>=2.14,<3",
    "nbformat>=5.10,<6",
    "notebook>=7.2,<8",
    "wheel>=0.45,<1",
    "watchdog>=5.0,<7",
    "twine>=5.1,<7",
    "tornado>=6.4,<7",
    "sphinx-rtd-theme>=2.0,<4",
    "sphinx-gallery>=0.17,<1",
    "sphinx>=7.3,<9",
    "seaborn>=0.13,<1",
    "requests>=2.32,<3",
    "pyzmq>=26.0,<27",
    "pip>=24.0",
    "pillow>=10.4,<12",
    "pytest>=8.3,<9",
    "pytest-runner>=6.0,<7",
    "cmake>=3.30,<4",
    "tox>=4.21,<5",
    "tox-uv>=1.16,<2",
]

[tool.uv]
constraint-dependencies = [
    "scs>=3.2.7",
    "rpds-py>=0.19.1",
    "joblib>=1.5.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
